name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Format
        run: cargo fmt --all -- --check

      # `multiple_crate_versions` fires on transitive duplicates pulled in by
      # the example dependencies (e.g. reqwest); not fixable from this crate.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -A clippy::multiple_crate_versions

      - name: Test
        run: cargo test
